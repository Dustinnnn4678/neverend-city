<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Neverend City admin</title>
<!-- Uses the same sign-in as the main site (sign in there first). Only accounts marked is_admin in the database can do anything here. -->
<style>
  body{margin:0;background:#0b0f1a;color:#eaf0ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
  main{max-width:960px;margin:0 auto;padding:18px}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:22px 0 8px}
  .card{background:#131a2b;border:1px solid #26314d;border-radius:12px;padding:12px;margin-bottom:10px}
  button{background:#1d2a4a;color:#eaf0ff;border:1px solid #3a4a75;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}button.bad{border-color:#a33}button.good{border-color:#2a8a4a}
  input,select{background:#0b0f1a;color:inherit;border:1px solid #3a4a75;border-radius:8px;padding:7px;font:inherit}
  table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid #26314d;text-align:left;vertical-align:top}.dim{opacity:.65}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}nav button.on{background:#2f6aa8}a{color:#8fc4ff}
</style></head>
<body><main>
<h1>Neverend City · admin</h1>
<div id="auth" class="card">Checking…</div>
<div id="app" style="display:none"><nav id="nav"></nav><div id="view"></div></div>
</main>
<script type="module">
import { Remote, remoteConfigured } from './remote.js';
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
if (!remoteConfigured) { $('auth').innerHTML = '<b>Not set up yet.</b> Fill in <code>config.js</code> (see <code>supabase/README.md</code>).'; throw new Error('no config'); }
const R = new Remote();
const sel = q => R.select(q), rpc = (fn, a) => R.rpc(fn, a);
const ins = (t, row) => R.api(`/rest/v1/${t}`, { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(row) });
const upd = (t, filter, patch) => R.api(`/rest/v1/${t}?${filter}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) });
const fail = e => { alert(e.message || e); };
let tab = 'claims';

async function boot() {
  await R.init();
  if (!R.signedIn) { $('auth').innerHTML = 'You are not signed in. Open <a href="./">the city</a>, click <b>Sign in</b> and log in with your email and password, then come back to this page.'; return; }
  let isAdmin = false; try { isAdmin = await rpc('is_admin'); } catch (e) { fail(e); }
  if (!isAdmin) { $('auth').innerHTML = `Signed in as ${esc(R.email)} but this account is not an admin yet. In Supabase run the "make admin" SQL from the guide, then reload. <button id="out">Sign out</button>`; $('out').onclick = () => { R.signOut(); location.reload(); }; return; }
  $('auth').innerHTML = `Signed in as ${esc(R.email)} (admin) <button id="out">Sign out</button> <a href="./">Back to the city</a>`; $('out').onclick = () => { R.signOut(); location.reload(); }; $('app').style.display = 'block'; render();
}
const TABS = [['claims', 'Claims'], ['giveaways', 'Giveaways'], ['streets', 'Street names'], ['cosmetics', 'Cosmetics and crate odds'], ['milestone', 'Milestones and events'], ['moderation', 'Reports'], ['launch', 'Beta and community'], ['stats', 'Stats']];
function render() { $('nav').innerHTML = TABS.map(([id, n]) => `<button data-t="${id}" class="${tab === id ? 'on' : ''}">${n}</button>`).join(''); $('nav').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); }); ({ claims, giveaways, streets, cosmetics, milestone, moderation, launch, stats })[tab]().catch(fail); }

async function moderation() {
  const rows = await rpc('admin_reports');
  $('view').innerHTML = `<h2>Open reports</h2><div class="dim">Players report names, homes and text with the Report button. Dismiss, remove the claim, or ban the account.</div><div class="card"><table><tr><th>When</th><th>What</th><th>Building</th><th>Player</th><th>Reason</th><th></th></tr>${rows.map(r => `<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.kind)}</td><td>${r.building == null ? '' : '#' + (r.building + 1)}</td><td>${esc(r.target || '')}</td><td>${esc(r.reason)}</td><td><button data-a="dismiss" data-id="${r.id}">Dismiss</button> <button class="bad" data-a="remove" data-id="${r.id}">Remove claim</button> <button class="bad" data-a="ban" data-id="${r.id}">Ban</button></td></tr>`).join('') || '<tr><td colspan="6" class="dim">Nothing to review.</td></tr>'}</table></div>`;
  $('view').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { if (b.dataset.a !== 'dismiss' && !confirm('Are you sure?')) return; try { await rpc('admin_resolve_report', { p_id: +b.dataset.id, p_action: b.dataset.a }); } catch (e) { fail(e); } moderation().catch(fail); });
}
async function launch() {
  const st = await rpc('admin_stats');
  $('view').innerHTML = `<h2>Invite-only beta</h2><div class="card"><div class="dim">While beta mode is ON, only people with an invite code (and you) can play. Everyone can still look at the city.</div><div class="row" style="margin-top:8px">Beta mode is <b>${esc(st.beta_mode)}</b> <button id="bon" class="good">Turn on</button> <button id="boff">Turn off</button></div>
<div class="row" style="margin-top:12px"><input id="ic" type="number" value="25" style="width:70px"> codes, each works <input id="im" type="number" value="1" style="width:60px"> time(s) <input id="in" placeholder="note (e.g. Instagram followers)" size="26"><button id="imake">Make codes</button></div><pre id="icodes" style="user-select:all"></pre>
<div class="row" style="margin-top:12px"><span class="dim">Before the public launch: removes every non-admin account and its data (only works while beta mode is on).</span><button class="bad" id="breset">Reset beta data</button></div></div>
<h2>City news</h2><div class="card"><div class="dim">Posts a line to the news feed, e.g. "Milestone: 2,500, highway unlocked!"</div><div class="row" style="margin-top:8px"><input id="nt" size="50" maxlength="200" placeholder="News text"><button id="npost">Post</button></div></div>
<h2>Community project</h2><div class="card"><div class="dim">Everyone chips in coins. Each player can give up to the cap. When it is funded everyone who helped gets the reward.</div><div class="row" style="margin-top:8px"><input id="cn" placeholder="Name (e.g. Giant Ferris Wheel)" size="28"><input id="cg" type="number" value="500000" style="width:100px"> goal <input id="cc" type="number" value="5000" style="width:80px"> cap per player <input id="cr" type="number" value="500" style="width:70px"> reward <button id="cmake">Create</button></div></div>`;
  $('bon').onclick = async () => { await rpc('admin_set_beta', { p_on: true }).catch(fail); launch().catch(fail); }; $('boff').onclick = async () => { await rpc('admin_set_beta', { p_on: false }).catch(fail); launch().catch(fail); };
  $('imake').onclick = async () => { try { const c = await rpc('admin_make_invites', { p_count: +$('ic').value, p_max_uses: +$('im').value, p_note: $('in').value }); $('icodes').textContent = c.join('\n'); } catch (e) { fail(e); } };
  $('breset').onclick = async () => { const t = prompt('This deletes every non-admin account and its data. Type RESET BETA to confirm:'); if (t === null) return; try { await rpc('admin_reset_beta', { p_confirm: t }); alert('Done'); } catch (e) { fail(e); } };
  $('npost').onclick = async () => { try { await rpc('admin_post_news', { p_text: $('nt').value }); $('nt').value = ''; alert('Posted'); } catch (e) { fail(e); } };
  $('cmake').onclick = async () => { try { await rpc('admin_create_coop', { p_name: $('cn').value, p_goal: +$('cg').value, p_cap: +$('cc').value, p_reward: +$('cr').value }); alert('Created'); } catch (e) { fail(e); } };
}

async function claims() {
  const data = await sel('claims?select=*&order=created_at.desc&limit=200');
  $('view').innerHTML = `<h2>Claims</h2><div class="dim">Instagram comments cannot be checked automatically yet: look at your latest post, find the code, then press Verify. YouTube claims are checked by the verify-youtube function once it is set up.</div><div class="card"><table><tr><th>Building</th><th>Who</th><th>Platform</th><th>Code</th><th>Status</th><th></th></tr>${data.map(c => `<tr><td>#${c.building + 1}</td><td>@${esc(c.username)} ${c.opt_in ? '' : '<span class="dim">(hidden)</span>'}</td><td>${c.platform}</td><td><code>${esc(c.code)}</code></td><td>${c.status}</td><td><button class="good" data-v="${c.id}">Verify</button> <button class="bad" data-r="${c.id}">Remove</button></td></tr>`).join('') || '<tr><td colspan="6" class="dim">No claims yet.</td></tr>'}</table></div>`;
  $('view').querySelectorAll('[data-v]').forEach(b => b.onclick = async () => { try { await rpc('admin_verify_claim', { p_id: +b.dataset.v }); } catch (e) { fail(e); } claims().catch(fail); });
  $('view').querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { const reason = prompt('Reason for removing (kept in a log):'); if (reason === null) return; try { await rpc('admin_remove_claim', { p_id: +b.dataset.r, p_reason: reason }); } catch (e) { fail(e); } claims().catch(fail); });
}
async function giveaways() {
  const data = await sel('giveaways?select=*&order=id.desc');
  $('view').innerHTML = `<h2>Giveaways</h2><div class="card"><b>New giveaway</b> <div class="dim">No purchase necessary. Publish your official rules page first (see docs/legal-drafts/giveaway-rules.md) and follow Instagram's promotion guidelines. Entrants are verified building owners who verified before the close time.</div><div class="row" style="margin-top:8px"><input id="gt" placeholder="Title"><input id="gu" placeholder="Official rules page URL" size="34"><input id="gc" type="datetime-local"><input id="gn" type="number" min="1" value="1" style="width:70px"><button id="gadd">Create</button></div></div>
${(data || []).map(g => `<div class="card"><b>${esc(g.title)}</b> <span class="dim">closes ${new Date(g.closes_at).toLocaleString()} · ${g.winner_count} winner(s)</span><div class="dim">Seed fingerprint: <code>${esc(g.seed_hash || 'not committed yet')}</code></div>${g.drawn_at ? `<div>Drawn ${new Date(g.drawn_at).toLocaleString()}. Seed: <code>${esc(g.seed)}</code></div>` : `<div class="row" style="margin-top:6px"><button data-c="${g.id}">1. Commit (publish fingerprint)</button><button data-d="${g.id}" class="good">2. Draw winners</button></div>`}</div>`).join('')}`;
  $('gadd').onclick = async () => { try { await ins('giveaways', { title: $('gt').value, rules_url: $('gu').value, closes_at: new Date($('gc').value).toISOString(), winner_count: +$('gn').value }); } catch (e) { fail(e); } giveaways().catch(fail); };
  $('view').querySelectorAll('[data-c]').forEach(b => b.onclick = async () => { try { const h = await rpc('admin_commit_giveaway', { p_id: +b.dataset.c }); alert('Fingerprint published: ' + h + '\nAnnounce it before you draw.'); } catch (e) { fail(e); } giveaways().catch(fail); });
  $('view').querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { if (!confirm('Draw now? This cannot be undone.')) return; try { const w = await rpc('admin_draw_giveaway', { p_id: +b.dataset.d }); alert('Winners:\n' + w.map(x => `#${x.building + 1} @${x.username} (${x.platform})`).join('\n')); } catch (e) { fail(e); } giveaways().catch(fail); });
}
async function streets() {
  const data = await sel('street_requests?select=*&order=created_at.desc');
  $('view').innerHTML = `<h2>Street name requests</h2><div class="card"><table><tr><th>Name</th><th>Status</th><th></th></tr>${(data || []).map(r => `<tr><td>${esc(r.street_name)}</td><td>${r.status}</td><td><button class="good" data-a="${r.id}">Approve</button> <button class="bad" data-x="${r.id}">Reject</button></td></tr>`).join('') || '<tr><td colspan="3" class="dim">No requests yet.</td></tr>'}</table></div>`;
  $('view').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => { try { await rpc('admin_review_street', { p_id: +b.dataset.a, p_approve: true }); } catch (e) { fail(e); } streets().catch(fail); });
  $('view').querySelectorAll('[data-x]').forEach(b => b.onclick = async () => { try { await rpc('admin_review_street', { p_id: +b.dataset.x, p_approve: false }); } catch (e) { fail(e); } streets().catch(fail); });
}
async function cosmetics() {
  const [o, c] = await Promise.all([sel('crate_odds?select=*&order=sort'), sel('cosmetics?select=*&order=level')]);
  $('view').innerHTML = `<h2>Crate odds</h2><div class="card">${o.map(r => `<div class="row">${r.rarity}: <input data-p="${r.rarity}" value="${r.p}" size="5"></div>`).join('')}<div class="row" style="margin-top:8px"><button id="osave">Save odds</button><span class="dim">Must add up to 1.00 (60/30/9/1 = 0.6, 0.3, 0.09, 0.01). The site shows these odds to everyone.</span></div></div>
<h2>Cosmetics</h2><div class="card"><table><tr><th>Name</th><th>Rarity</th><th>Level</th><th>Cost</th><th>Source</th><th>On</th></tr>${c.map(x => `<tr><td>${esc(x.name)}</td><td>${x.rarity}</td><td>${x.level}</td><td><input data-cost="${x.id}" value="${x.cost ?? ''}" size="5" ${x.source === 'crate' ? 'disabled' : ''}></td><td>${x.source}</td><td><input type="checkbox" data-en="${x.id}" ${x.enabled ? 'checked' : ''}></td></tr>`).join('')}</table><button id="csave" style="margin-top:8px">Save cosmetics</button></div>`;
  $('osave').onclick = async () => { const rows = [...$('view').querySelectorAll('[data-p]')].map(i => ({ rarity: i.dataset.p, p: +i.value })); const sum = rows.reduce((a, r) => a + r.p, 0); if (Math.abs(sum - 1) > 1e-6) return alert('Odds add up to ' + sum + ', they must add up to 1.'); try { for (const r of rows) await upd('crate_odds', `rarity=eq.${r.rarity}`, { p: r.p }); alert('Saved'); } catch (e) { fail(e); } };
  $('csave').onclick = async () => { try { for (const i of $('view').querySelectorAll('[data-cost]')) if (!i.disabled && i.value !== '') await upd('cosmetics', `id=eq.${i.dataset.cost}`, { cost: +i.value }); for (const i of $('view').querySelectorAll('[data-en]')) await upd('cosmetics', `id=eq.${i.dataset.en}`, { enabled: i.checked }); alert('Saved'); } catch (e) { fail(e); } };
}
async function milestone() {
  $('view').innerHTML = `<h2>When the city reaches a milestone</h2><div class="card"><div class="dim">Records it, starts the 10-minute double-points event for everyone online, gives every player a crate, and pays everyone who predicted the right day.</div><div class="row" style="margin-top:8px"><input id="ms" type="number" placeholder="e.g. 400"><button id="msb" class="good">Settle milestone</button></div></div><h2>Today's golden objects</h2><div class="card"><div class="dim">Hides three golden stars on rooftops for today. Everyone hunts the same three.</div><div class="row" style="margin-top:8px"><input id="gt2" type="number" placeholder="how many buildings exist"><button id="gb">Create today's 3</button></div></div>`;
  $('msb').onclick = async () => { try { await rpc('admin_settle_milestone', { p_milestone: +$('ms').value }); alert('Done'); } catch (e) { fail(e); } };
  $('gb').onclick = async () => { try { const d = await rpc('admin_ensure_golden', { p_day: Math.floor(Date.now() / 86400000), p_total: +$('gt2').value }); alert('Today: building numbers ' + d.map(x => x + 1).join(', ')); } catch (e) { fail(e); } };
}
async function stats() {
  const s = await rpc('admin_stats'), pct = v => v == null ? 'not enough data yet' : v + '%';
  $('view').innerHTML = `<h2>Stats</h2><div class="card">Players: <b>${s.players}</b> · Claims: <b>${s.claims}</b><br>Active today: <b>${s.dau}</b> · this week: <b>${s.wau}</b> · this month: <b>${s.mau}</b><br>Came back after 1 day: <b>${pct(s.d1)}</b> · after 7 days: <b>${pct(s.d7)}</b> · after 30 days: <b>${pct(s.d30)}</b><br>Live revenue so far: <b>$${(s.revenue_cents_live / 100).toFixed(2)}</b> <span class="dim">(test payments are not counted)</span><br>Open reports: <b>${s.open_reports}</b></div>`;
}
boot().catch(fail);
</script></body></html>
